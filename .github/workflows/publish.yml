# Draws the maps and publishes the website to the gh-pages branch, which
# GitHub Pages serves. Runs on every push to main, or by hand from the
# Actions tab. On a pull request it draws and renders only, as a check that
# everything still builds, and publishes nothing.
# Based on the publish workflow in Cryptococcus-cost-analysis.
#
# R/main.R runs here, on GitHub, because it downloads the live HRSA
# transplant-center layer. Its maps go to figures/ and its regional tables
# to tables/, which the Maps page shows; neither they nor the rendered site
# (docs/) is committed. Each run keeps the map files, TIFFs included, as an
# artifact. The pages themselves run only the hidden knitr::read_chunk()
# imports, the Architecture page's reading of ARCHITECTURE.md, and the Maps
# page's reading of the tables in tables/. A failed run publishes nothing, so
# the last good site stays live.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Draw maps and publish website

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # So R reads and writes non-ASCII characters (such as en dashes) as UTF-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Quarto before R, as in Cryptococcus-cost-analysis. Pinned to the
      # version used to build the site during setup; change it in a pull
      # request.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # What R/main.R and the pages use
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::VagishHemmige/sRtr
            any::sf
            any::dplyr
            any::stringr
            any::tibble
            any::ggplot2
            any::colorspace
            any::tmap
            any::knitr
            any::rmarkdown

      - name: Draw the maps
        run: Rscript R/main.R

      # Keeps every map file (PNG, PDF and 600 dpi TIFF) and the regional
      # tables with the run, for download from its Artifacts section
      - name: Keep the maps and tables with the run
        uses: actions/upload-artifact@v4
        with:
          name: maps-and-tables
          path: |
            figures/
            tables/

      - name: Render (pull requests only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
